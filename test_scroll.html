<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    display: flex;
    flex-direction: column-reverse;
    overflow-y: auto;
    height: 200px;
    border: 1px solid black;
  }
  .list {
    display: flex;
    flex-direction: column;
  }
  .msg {
    height: 50px;
    border: 1px solid red;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="list">
      <div class="msg">1 (Oldest)</div>
      <div class="msg">2</div>
      <div class="msg">3</div>
      <div class="msg">4</div>
      <div class="msg">5</div>
      <div class="msg">6 (Newest)</div>
    </div>
  </div>
</body>
</html>
